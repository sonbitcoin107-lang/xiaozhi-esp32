name: Robotweb Build Firmware

on:
  workflow_dispatch:
    inputs:
      board_type:
        description: Board directory
        required: false
        default: custom/robotweb-esp32s3-st7789
  push:
    branches:
      - main
      - 'robotweb/**'

permissions:
  contents: read

jobs:
  build:
    name: Build board firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build firmware
        run: |
          BOARD="${{ github.event.inputs.board_type || 'custom/robotweb-esp32s3-st7789' }}"
          echo "=== Building: $BOARD ==="
          python scripts/build.py "$BOARD" --name robotweb-esp32s3-st7789
          echo "=== Output files ==="
          find releases/ -name "*.zip" 2>/dev/null | head -5
          ls -lh releases/ 2>/dev/null || echo "No releases dir"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: robotweb-firmware-${{ github.run_number }}
          path: releases/
          retention-days: 30
          if-no-files-found: warn
