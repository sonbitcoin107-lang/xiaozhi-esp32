name: Robotweb Build Firmware

on:
  workflow_dispatch:
    inputs:
      board_type:
        description: Board type ID (from config.json board_type field)
        required: false
        default: robotweb-esp32s3-st7789
  push:
    branches:
      - main
      - 'robotweb/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build board firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          command: |
            BOARD="${{ github.event.inputs.board_type }}"
            BOARD="${BOARD:-robotweb-esp32s3-st7789}"
            echo "=== Building board_type: $BOARD ==="
            python scripts/build.py "$BOARD"
            echo "=== Done ==="
            echo "=== Output files ==="
            find build/ -name "*.bin" -size +100k 2>/dev/null | head -20
            find releases/ -name "*.zip" 2>/dev/null | head -10

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ github.run_number }}
          path: |
            build/merged-binary.bin
            build/*.bin
            releases/*.zip
          retention-days: 30
          if-no-files-found: warn
