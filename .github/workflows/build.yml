name: Build Boards

on:
  workflow_dispatch:
    inputs:
      board_path:
        description: Board directory to build
        required: false
        default: main/boards/custom/robotweb-esp32s3-st7789
  push:
    branches:
      - main
      - 'ci/**'
      - 'robotweb/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build board
        shell: bash
        env:
          BOARD_INPUT: ${{ github.event.inputs.board_path }}
        run: |
          BOARD="${BOARD_INPUT:-main/boards/custom/robotweb-esp32s3-st7789}"
          echo "=== Building board: $BOARD ==="
          python scripts/build.py "$BOARD"
          echo "=== Build complete ==="

      - name: List build outputs
        shell: bash
        if: always()
        run: |
          echo "=== Build outputs ==="
          find build/ -name "*.bin" -size +1k 2>/dev/null | head -20 || echo "No .bin found"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: firmware-bin
          path: |
            build/merged-binary.bin
            build/*.bin
          retention-days: 7
