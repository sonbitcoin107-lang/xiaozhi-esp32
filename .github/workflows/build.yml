name: Robotweb Build Firmware

on:
  workflow_dispatch:
    inputs:
      board_type:
        description: Board directory
        required: false
        default: bread-compact-wifi-lcd
      build_name:
        description: Build variant name
        required: false
        default: robotweb-cloud

permissions:
  contents: read

jobs:
  build:
    name: Build board firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          BOARD="${{ github.event.inputs.board_type || 'bread-compact-wifi-lcd' }}"
          BUILD_NAME="${{ github.event.inputs.build_name || 'robotweb-cloud' }}"
          echo "=== Building: $BOARD (variant: $BUILD_NAME) ==="
          python scripts/build.py "$BOARD" --name "$BUILD_NAME" --language vi-VN
          echo "=== Build done — collecting artifacts ==="
          mkdir -p releases
          # scripts/build.py outputs merged-binary.bin in build/
          if [ -f "build/merged-binary.bin" ]; then
            cp build/merged-binary.bin releases/robotweb-firmware-merged.bin
            echo "Copied build/merged-binary.bin to releases/"
          fi
          # Also collect individual partition bins if present
          for f in build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/xiaozhi.bin; do
            [ -f "$f" ] && cp "$f" releases/ && echo "Copied: $f"
          done
          ls -lh releases/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robotweb-firmware-${{ github.run_number }}
          path: |
            build/merged-binary.bin
            releases/
          retention-days: 30
          if-no-files-found: warn
