name: Robotweb Build Firmware

on:
  workflow_dispatch:
    inputs:
      board_type:
        description: Board directory
        required: false
        default: custom/robotweb-esp32s3-st7789
      build_name:
        description: Build variant name
        required: false
        default: robotweb-esp32s3-st7789

permissions:
  contents: read

jobs:
  build:
    name: Build board firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          BOARD="${{ github.event.inputs.board_type || 'custom/robotweb-esp32s3-st7789' }}"
          BUILD_NAME="${{ github.event.inputs.build_name || 'robotweb-esp32s3-st7789' }}"
          echo "=== Building: $BOARD (variant: $BUILD_NAME) ==="
          python scripts/build.py "$BOARD" --name "$BUILD_NAME" --language vi-VN --wake-word wn9_hiesp
          
          # Tự động nhúng phân vùng Assets tùy biến của Board (nếu có assets.bin trong thư mục board)
          ASSETS_FILE="main/boards/$BOARD/assets.bin"
          if [ -f "$ASSETS_FILE" ] && [ -f "build/merged-binary.bin" ]; then
            echo "=== Tự động nhúng assets tùy biến: $ASSETS_FILE vào 0x800000 ==="
            python -c "
          with open('build/merged-binary.bin', 'rb') as f: data = bytearray(f.read())
          with open('$ASSETS_FILE', 'rb') as f: assets = f.read()
          target_len = 0x800000 + len(assets)
          if len(data) < target_len:
              data.extend(b'\xff' * (target_len - len(data)))
          data[0x800000:0x800000+len(assets)] = assets
          with open('build/merged-binary.bin', 'wb') as f: f.write(data)
            "
            echo "Nhúng assets thành công! Kích thước file merged: $(wc -c < build/merged-binary.bin) bytes"
          fi

          echo "=== Build done — collecting artifacts ==="
          mkdir -p releases
          # scripts/build.py outputs merged-binary.bin in build/
          if [ -f "build/merged-binary.bin" ]; then
            cp build/merged-binary.bin releases/robotweb-firmware-merged.bin
            echo "Copied build/merged-binary.bin to releases/"
          fi
          # Also collect individual partition bins if present
          for f in build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/xiaozhi.bin; do
            [ -f "$f" ] && cp "$f" releases/ && echo "Copied: $f"
          done
          ls -lh releases/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robotweb-firmware-${{ github.run_number }}
          path: |
            build/merged-binary.bin
            releases/
          retention-days: 30
          if-no-files-found: warn
