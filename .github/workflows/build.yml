name: Robotweb Build Firmware

on:
  workflow_dispatch:
    inputs:
      board_path:
        description: Board directory to build
        required: false
        default: main/boards/custom/robotweb-esp32s3-st7789
  push:
    branches:
      - main
      - 'robotweb/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build board firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          command: |
            BOARD="${{ github.event.inputs.board_path }}"
            BOARD="${BOARD:-main/boards/custom/robotweb-esp32s3-st7789}"
            echo "Building: $BOARD"
            python scripts/build.py "$BOARD"

      - name: List build outputs
        if: always()
        run: |
          echo "=== Build outputs ==="
          find . -name "*.bin" -size +1k 2>/dev/null | grep -v ".git" | head -20 || echo "No .bin found"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/*.bin
          retention-days: 30
          if-no-files-found: warn
